name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners ship bash 3.2 and zsh, so the shell hooks are tested
        # against the exact versions Mac users have.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install zsh and vim (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh vim
      - run: cargo fmt -p shellvisor -p sv-proto --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --all 2>&1 | tee test.log; then
            # show what failed as an annotation (readable without signing in)
            grep -E "^---- |panicked at|timed out waiting|^failures:|^    [a-z_:]+$" -A25 test.log | head -200 > fail.txt || true
            echo "::error title=cargo test failed::$(awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}' fail.txt)"
            exit 1
          fi
      - run: cargo build --release
      - name: Performance budget
        run: cargo run --release --example bench -- --check
        env:
          BENCH_IDLE_SECS: "10"
