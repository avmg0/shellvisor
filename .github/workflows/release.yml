name: Release

# Push a tag like v1.0.0 to build, sign and publish binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub release
  id-token: write      # sign build provenance (Sigstore)
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # both macOS builds on one Mac runner (Mac runners can be scarce)
          - { name: macos, targets: "aarch64-apple-darwin x86_64-apple-darwin", os: macos-latest }
          - { name: linux-x86_64, targets: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { name: linux-arm64, targets: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.targets }}
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked -p shellvisor --target "$t"
          done

      # macOS code signing + notarization, only when the secrets are set up
      # (see docs/RELEASING.md). Without them the binary is unsigned but the
      # provenance attestation below still applies.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          for t in ${{ matrix.targets }}; do
            BIN=target/$t/release/shellvisor
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "$BIN"
            ditto -c -k "$BIN" notarize.zip
            xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            rm -f notarize.zip
          done
          rm -f cert.p12

      - name: Package
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            NAME=shellvisor-${GITHUB_REF_NAME}-$t
            mkdir -p "dist/$NAME"
            cp target/$t/release/shellvisor LICENSE NOTICE README.md "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
            (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
            # Debian / Ubuntu package next to the archive
            case "$t" in
              x86_64-unknown-linux-gnu) ARCH=amd64 ;;
              aarch64-unknown-linux-gnu) ARCH=arm64 ;;
              *) ARCH= ;;
            esac
            if [ -n "$ARCH" ]; then
              DEB=$(scripts/package-deb.sh "${GITHUB_REF_NAME#v}" "target/$t/release/shellvisor" "$ARCH" dist)
              (cd dist && shasum -a 256 "$(basename "$DEB")" > "$(basename "$DEB").sha256")
            fi
          done
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/attest-build-provenance@v3
        if: runner.os == 'Linux'
        with:
          subject-path: dist/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Shellvisor $GITHUB_REF_NAME" --generate-notes
